<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>徽章 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>徽章</h1>
      <p class="demo-subtitle">badge.css — 状态徽章与语义别名</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>语义变体</h2>
      <div class="demo-row">
        <span class="badge">默认</span>
        <span class="badge badge-info">信息</span>
        <span class="badge badge-success">成功</span>
        <span class="badge badge-warning">警告</span>
        <span class="badge badge-danger">危险</span>
      </div>
    </div>

    <div class="demo-section">
      <h2>状态别名</h2>
      <div class="demo-row">
        <span class="badge badge-online">在线</span>
        <span class="badge badge-running">运行中</span>
        <span class="badge badge-completed">已完成</span>
        <span class="badge badge-enabled">已启用</span>
        <span class="badge badge-pending">待处理</span>
        <span class="badge badge-offline">离线</span>
        <span class="badge badge-failed">失败</span>
        <span class="badge badge-disabled">已停用</span>
      </div>
    </div>

    <div class="demo-section">
      <h2>布尔 / 判定别名</h2>
      <div class="demo-row">
        <span class="badge badge-true">是</span>
        <span class="badge badge-false">否</span>
        <span class="badge badge-valid">有效</span>
        <span class="badge badge-invalid">无效</span>
        <span class="badge badge-accept">接受</span>
        <span class="badge badge-reject">拒绝</span>
      </div>
    </div>

    <div class="demo-section">
      <h2>徽章在组件中的使用</h2>
      <div class="demo-column">
        <button class="button button-icon" type="button">
          通知
          <span class="badge badge-danger">3</span>
        </button>
        <div class="card" style="margin:0">
          <p style="margin-top:0">服务状态：<span class="badge badge-online">正常</span></p>
          <p>数据同步：<span class="badge badge-running">同步中</span></p>
        </div>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
