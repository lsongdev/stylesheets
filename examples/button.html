<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按钮 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>按钮</h1>
      <p class="demo-subtitle">button.css — 基础按钮、变体、尺寸、分组与图标按钮</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>变体</h2>
      <div class="demo-row">
        <button class="button" type="button">默认</button>
        <button class="button button-primary" type="button">主按钮</button>
        <button class="button button-secondary" type="button">次要</button>
        <button class="button button-success" type="button">成功</button>
        <button class="button button-warning" type="button">警告</button>
        <button class="button button-danger" type="button">危险</button>
        <button class="button button-ghost" type="button">幽灵</button>
        <button class="button button-link" type="button">链接式</button>
      </div>
      <p class="text-sm muted">
        注意：<code class="demo-code">type="submit"</code> 的按钮默认即为主按钮样式；
        未加变体类时使用默认（描边）外观。
      </p>
    </div>

    <div class="demo-section">
      <h2>链接按钮与禁用态</h2>
      <div class="demo-row">
        <a class="button button-primary" href="#">链接按钮</a>
        <a class="button button-secondary" href="#">描边链接</a>
        <button class="button button-primary" type="button" disabled>禁用主按钮</button>
        <button class="button" type="button" disabled>禁用默认</button>
      </div>
    </div>

    <div class="demo-section">
      <h2>尺寸</h2>
      <div class="demo-row">
        <button class="button button-small" type="button">小号</button>
        <button class="button" type="button">常规</button>
        <button class="button button-large" type="button">大号</button>
      </div>
      <div class="demo-block">
        <button class="button button-block" type="button">通栏（.button-block）</button>
      </div>
    </div>

    <div class="demo-section">
      <h2>按钮组（.button-group）</h2>
      <div class="demo-row">
        <div class="button-group">
          <button class="button" type="button">左</button>
          <button class="button button-primary" type="button">中</button>
          <button class="button" type="button">右</button>
        </div>
        <div class="button-group">
          <button class="button button-small" type="button">日</button>
          <button class="button button-small button-primary" type="button">周</button>
          <button class="button button-small" type="button">月</button>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>图标按钮</h2>
      <div class="demo-row">
        <button class="button button-icon button-primary" type="button">
          <svg class="button-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          新建
        </button>
        <button class="button button-icon" type="button">
          <svg class="button-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5v14"/>
          </svg>
          关闭
        </button>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
