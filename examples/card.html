<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡片 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>卡片</h1>
      <p class="demo-subtitle">card.css — 内容容器，圆角 / 内边距 / 阴影全部由令牌控制</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>基本卡片</h2>
      <div class="card">
        <h3 style="margin-top:0">CSS Components</h3>
        <p>卡片使用 <code class="demo-code">--card-padding</code>（28px）、<code class="demo-code">--card-border-radius</code>（14px）与 <code class="demo-code">--card-shadow</code>。标题、正文与按钮是常规 HTML，直接放入即可。</p>
        <div class="demo-row" style="margin-bottom:0">
          <button class="button button-primary" type="button">了解更多</button>
          <button class="button" type="button">取消</button>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>可选中卡片（.card.selectable）</h2>
      <div class="grid grid-cols-2 sm-grid-cols-1">
        <div class="card selectable">
          <h3 style="margin-top:0">基础版</h3>
          <p class="text-2xl font-bold">¥0</p>
          <p class="text-sm muted">适合个人项目与学习</p>
          <button class="button button-secondary button-block" type="button">选择</button>
        </div>
        <div class="card selectable active">
          <h3 style="margin-top:0">专业版</h3>
          <p class="text-2xl font-bold">¥29</p>
          <p class="text-sm muted">适合团队协作（当前选中）</p>
          <button class="button button-primary button-block" type="button">选择</button>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>令牌覆盖</h2>
      <div class="card" style="--card-padding: 16px; --card-border-radius: var(--radius-sm); --card-bg: var(--color-surface-subtle); --card-border: 1px dashed var(--color-border-strong)">
        <p style="margin:0">通过内联令牌覆盖卡片外观：紧凑内边距、小圆角、虚线边框、次要底色。</p>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
