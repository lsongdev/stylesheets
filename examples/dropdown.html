<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下拉 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>下拉菜单</h1>
      <p class="demo-subtitle">dropdown.css — 触发器 + 内容面板，点击展开 / 收起</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <p>
      结构：<code class="demo-code">.dropdown &gt; .dropdown-toggle + .dropdown-content</code>。
      触发器加 <code class="demo-code">data-dropdown="id"</code>，目标面板使用该 id；点击外部自动关闭。
    </p>

    <div class="demo-section">
      <h2>基础下拉</h2>
      <div class="demo-row">
        <div class="dropdown">
          <button class="button button-primary dropdown-toggle" type="button" data-dropdown="drop-1">更多操作</button>
          <div class="dropdown-content" id="drop-1">
            <a class="dropdown-item" href="#">编辑</a>
            <a class="dropdown-item" href="#">复制链接</a>
            <div class="dropdown-separator"></div>
            <a class="dropdown-item" href="#">删除</a>
          </div>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>对齐方式（.dropdown.right / .dropdown.left）</h2>
      <div class="demo-row">
        <div class="dropdown right">
          <button class="button button-secondary dropdown-toggle" type="button" data-dropdown="drop-2">右对齐</button>
          <div class="dropdown-content" id="drop-2">
            <a class="dropdown-item" href="#">选项一</a>
            <a class="dropdown-item" href="#">选项二</a>
          </div>
        </div>
        <div class="dropdown left">
          <button class="button button-secondary dropdown-toggle" type="button" data-dropdown="drop-3">左对齐</button>
          <div class="dropdown-content" id="drop-3">
            <a class="dropdown-item" href="#">选项一</a>
            <a class="dropdown-item" href="#">选项二</a>
          </div>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>带图标的分隔列表</h2>
      <div class="dropdown">
        <button class="button button-secondary dropdown-toggle" type="button" data-dropdown="drop-4">用户菜单</button>
        <div class="dropdown-content" id="drop-4">
          <a class="dropdown-item" href="#">👤 个人资料</a>
          <a class="dropdown-item" href="#">⚙️ 设置</a>
          <div class="dropdown-separator"></div>
          <a class="dropdown-item" href="#">🚪 退出登录</a>
        </div>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
