<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>表单</h1>
      <p class="demo-subtitle">form.css — 字段分组、帮助 / 错误文本、内联表单、动作区与栅格</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>表单（.form + .form-group）</h2>
      <form class="form" onsubmit="return false">
        <div class="form-group">
          <label for="f-name">姓名</label>
          <input type="text" class="input" id="f-name" name="name" placeholder="请输入姓名">
          <small class="help-text">辅助说明文本：帮助用户理解字段用途。</small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-email">邮箱</label>
            <input type="email" class="input" id="f-email" name="email" autocomplete="email" placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label for="f-phone">电话</label>
            <input type="tel" class="input" id="f-phone" name="phone" autocomplete="tel" placeholder="可选">
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="f-role">角色</label>
            <select class="input" id="f-role" name="role">
              <option>管理员</option>
              <option>编辑</option>
              <option selected>访客</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-plan">套餐</label>
            <select class="input" id="f-plan" name="plan">
              <option>免费版</option>
              <option selected>专业版</option>
              <option>企业版</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="f-bio">简介</label>
          <textarea class="input" id="f-bio" name="bio" rows="3" placeholder="一句话介绍自己"></textarea>
        </div>

        <div class="form-group">
          <label>通知偏好</label>
          <div class="demo-row">
            <div class="form-check">
              <input type="checkbox" id="f-check-1" checked>
              <label for="f-check-1">邮件通知</label>
            </div>
            <div class="form-check">
              <input type="checkbox" id="f-check-2">
              <label for="f-check-2">短信通知</label>
            </div>
          </div>
        </div>

        <div class="demo-block">
          <span class="demo-label">公开状态（switch 组件）</span>
          <div class="switch">
            <input type="checkbox" class="switch-input" id="f-switch" checked>
            <label for="f-switch" class="switch-label" aria-label="公开"></label>
          </div>
        </div>

        <div class="form-actions">
          <button class="button button-primary" type="submit">提交</button>
          <button class="button" type="reset">重置</button>
        </div>
      </form>
    </div>

    <div class="demo-section">
      <h2>错误状态</h2>
      <form class="form" onsubmit="return false">
        <div class="form-group">
          <label for="f-error">用户名</label>
          <input type="text" class="input input-error" id="f-error" aria-invalid="true" value="已被占用">
          <small class="error">该用户名已被占用</small>
        </div>
      </form>
    </div>

    <div class="demo-section">
      <h2>内联表单（.form-inline）</h2>
      <form class="form-inline" onsubmit="return false">
        <div class="form-group">
          <label for="i-keyword">关键词</label>
          <input type="search" class="input" id="i-keyword" placeholder="搜索…">
        </div>
        <div class="form-group">
          <label for="i-status">状态</label>
          <select class="input" id="i-status">
            <option>全部</option>
            <option>进行中</option>
            <option>已完成</option>
          </select>
        </div>
        <button class="button button-primary" type="submit">筛选</button>
      </form>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
