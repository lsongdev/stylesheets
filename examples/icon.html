<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图标 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../icon.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>图标</h1>
      <p class="demo-subtitle">icon.css — Font Awesome 6 与 SVG 掩码图标</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <p>
      <code class="demo-code">icon.css</code> 会通过 CDN 引入 Font Awesome 6；未联网时可用
      <code class="demo-code">.icon</code> 掩码图标或内联 SVG。单独演示时请保留对它的引用。
    </p>

    <div class="demo-section">
      <h2>Font Awesome</h2>
      <div class="demo-row">
        <i class="fas fa-house"></i>
        <i class="fas fa-magnifying-glass"></i>
        <i class="fas fa-gear"></i>
        <i class="fas fa-bell"></i>
        <i class="fas fa-user"></i>
        <i class="fas fa-envelope"></i>
        <i class="fas fa-download"></i>
        <i class="fas fa-cloud"></i>
      </div>
    </div>

    <div class="demo-section">
      <h2>SVG 掩码图标（.icon + --svg）</h2>
      <div class="demo-row">
        <span class="icon icon-carbon-edit-off" role="img" aria-label="edit off"></span>
        <span class="icon icon-carbon-humidity" role="img" aria-label="humidity"></span>
        <span class="icon icon-fluent-emoji-flat-alarm-clock" role="img" aria-label="alarm clock"></span>
        <span class="icon" style="--svg: url('https://api.iconify.design/mdi/heart.svg')" role="img" aria-label="heart"></span>
      </div>
    </div>

    <div class="demo-section">
      <h2>图标与按钮</h2>
      <div class="demo-row">
        <button class="button button-icon button-primary" type="button">
          <i class="fas fa-download" aria-hidden="true"></i>
          下载
        </button>
        <button class="button button-icon" type="button">
          <i class="fas fa-copy" aria-hidden="true"></i>
          复制
        </button>
      </div>
    </div>

    <div class="demo-section">
      <h2>内联 SVG（无需网络）</h2>
      <div class="demo-row">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 9v11"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
