            height: 100vh;

        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-left: var(--sidebar-width, 250px); /* Account for vertical navigation width */
            height: 100vh;
            overflow: hidden;

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;

        <div class="main-content">

        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle submenu for vertical menu
            document.querySelectorAll('.menu-vertical li:has(ul) > a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const li = link.parentElement;
                    const submenu = li.querySelector('ul');
                    if (submenu) {
                        const isOpen = submenu.style.display === 'block';
                        submenu.style.display = isOpen ? 'none' : 'block';
                        li.classList.toggle('menu-open', !isOpen);
                    }
                });
            });
        });
    </script>
