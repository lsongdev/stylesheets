<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input - CSS Components Demo</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="../input.css">
    <link rel="stylesheet" href="../form.css">
    <style>
        body {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            margin-top: 24px;
            margin-bottom: 16px;
        }
        .input-group {
            margin: 20px 0;
            padding: 20px;
            border-left: 4px solid #4F46E5;
            background-color: #f9f9f9;
        }
        .form-control {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-row .form-control {
            flex: 1;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Input 输入框组件</h1>
        <p>这是输入框组件的演示页面，展示了各种输入框样式和类型。</p>
        
        <div class="input-group">
            <h2>基本输入框</h2>
            <div class="form-control">
                <label class="form-label">文本输入框</label>
                <input type="text" class="input" placeholder="请输入文本...">
            </div>
            
            <div class="form-control">
                <label class="form-label">密码输入框</label>
                <input type="password" class="input" placeholder="请输入密码...">
            </div>
            
            <div class="form-control">
                <label class="form-label">邮箱输入框</label>
                <input type="email" class="input" placeholder="example@email.com">
            </div>
            
            <div class="form-control">
                <label class="form-label">数字输入框</label>
                <input type="number" class="input" placeholder="请输入数字...">
            </div>
            
            <div class="form-control">
                <label class="form-label">电话输入框</label>
                <input type="tel" class="input" placeholder="请输入电话号码...">
            </div>
        </div>
        
        <div class="input-group">
            <h2>不同尺寸的输入框</h2>
            <div class="form-control">
                <label class="form-label">小型输入框</label>
                <input type="text" class="input input-sm" placeholder="小型输入框">
            </div>
            
            <div class="form-control">
                <label class="form-label">标准输入框</label>
                <input type="text" class="input input-md" placeholder="标准输入框">
            </div>
            
            <div class="form-control">
                <label class="form-label">大型输入框</label>
                <input type="text" class="input input-lg" placeholder="大型输入框">
            </div>
        </div>
        
        <div class="input-group">
            <h2>带前后缀的输入框</h2>
            <div class="form-control">
                <label class="form-label">带前缀的输入框</label>
                <div class="input-group">
                    <span class="input-group-prepend">@</span>
                    <input type="text" class="input" placeholder="用户名">
                </div>
            </div>
            
            <div class="form-control">
                <label class="form-label">带后缀的输入框</label>
                <div class="input-group">
                    <input type="text" class="input" placeholder="金额">
                    <span class="input-group-append">元</span>
                </div>
            </div>
            
            <div class="form-control">
                <label class="form-label">带前后缀的输入框</label>
                <div class="input-group">
                    <span class="input-group-prepend">https://</span>
                    <input type="text" class="input" placeholder="example.com">
                    <span class="input-group-append">.com</span>
                </div>
            </div>
        </div>
        
        <div class="input-group">
            <h2>不同状态的输入框</h2>
            <div class="form-control">
                <label class="form-label">成功状态</label>
                <input type="text" class="input input-success" placeholder="成功状态输入框">
            </div>
            
            <div class="form-control">
                <label class="form-label">错误状态</label>
                <input type="text" class="input input-error" placeholder="错误状态输入框">
            </div>
            
            <div class="form-control">
                <label class="form-label">警告状态</label>
                <input type="text" class="input input-warning" placeholder="警告状态输入框">
            </div>
            
            <div class="form-control">
                <label class="form-label">禁用状态</label>
                <input type="text" class="input" placeholder="禁用状态输入框" disabled>
            </div>
        </div>
        
        <div class="input-group">
            <h2>多行文本输入框</h2>
            <div class="form-control">
                <label class="form-label">文本域</label>
                <textarea class="input input-textarea" rows="4" placeholder="请输入多行文本..."></textarea>
            </div>
            
            <div class="form-control">
                <label class="form-label">调整大小的文本域</label>
                <textarea class="input input-textarea resize-y" rows="3" placeholder="垂直可调整大小"></textarea>
            </div>
        </div>
        
        <div class="input-group">
            <h2>搜索输入框</h2>
            <div class="form-control">
                <label class="form-label">搜索框</label>
                <div class="input-group">
                    <span class="input-group-prepend"><i class="fas fa-search"></i></span>
                    <input type="search" class="input" placeholder="搜索...">
                </div>
            </div>
        </div>
        
        <div class="input-group">
            <h2>组合输入框</h2>
            <div class="input-row">
                <div class="form-control">
                    <label class="form-label">姓名</label>
                    <input type="text" class="input" placeholder="姓">
                </div>
                <div class="form-control">
                    <label class="form-label">&nbsp;</label>
                    <input type="text" class="input" placeholder="名">
                </div>
            </div>
            
            <div class="input-row">
                <div class="form-control">
                    <label class="form-label">城市</label>
                    <input type="text" class="input" placeholder="城市">
                </div>
                <div class="form-control">
                    <label class="form-label">邮编</label>
                    <input type="text" class="input" placeholder="邮编">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
