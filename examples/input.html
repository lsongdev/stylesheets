<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入框 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>输入框</h1>
      <p class="demo-subtitle">input.css — 文本 / 密码 / 数字、尺寸、状态、前后缀与组合</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>基本输入框</h2>
      <div class="demo-block">
        <label for="basic-text">文本输入框</label>
        <input type="text" class="input" id="basic-text" name="text" placeholder="请输入文本…">
      </div>
      <div class="demo-block">
        <label for="basic-password">密码输入框</label>
        <input type="password" class="input" id="basic-password" name="password" autocomplete="current-password" placeholder="请输入密码…">
      </div>
      <div class="demo-block">
        <label for="basic-email">邮箱输入框</label>
        <input type="email" class="input" id="basic-email" name="email" autocomplete="email" spellcheck="false" placeholder="name@example.com">
      </div>
      <div class="demo-block">
        <label for="basic-number">数字输入框</label>
        <input type="number" class="input" id="basic-number" name="number" placeholder="请输入数字…">
      </div>
    </div>

    <div class="demo-section">
      <h2>尺寸</h2>
      <div class="demo-block">
        <label for="small-input">小型</label>
        <input type="text" class="input input-small" id="small-input" placeholder=".input-small">
      </div>
      <div class="demo-block">
        <label for="standard-input">标准</label>
        <input type="text" class="input" id="standard-input" placeholder=".input">
      </div>
      <div class="demo-block">
        <label for="large-input">大型</label>
        <input type="text" class="input input-large" id="large-input" placeholder=".input-large">
      </div>
    </div>

    <div class="demo-section">
      <h2>状态</h2>
      <div class="demo-block">
        <label for="success-input">成功（.input-success）</label>
        <input type="text" class="input input-success" id="success-input" placeholder="成功状态输入框">
      </div>
      <div class="demo-block">
        <label for="error-input">错误（.input-error / aria-invalid）</label>
        <input type="text" class="input input-error" id="error-input" aria-invalid="true" aria-describedby="error-help" placeholder="错误状态输入框">
        <small class="field-help" id="error-help">请输入有效内容</small>
      </div>
      <div class="demo-block">
        <label for="warning-input">警告（.input-warning）</label>
        <input type="text" class="input input-warning" id="warning-input" placeholder="警告状态输入框">
      </div>
      <div class="demo-block">
        <label for="disabled-input">禁用</label>
        <input type="text" class="input" id="disabled-input" placeholder="禁用状态输入框" disabled>
      </div>
    </div>

    <div class="demo-section">
      <h2>前后缀（.input-group + .input-addon）</h2>
      <div class="demo-block">
        <label for="username">带前缀</label>
        <div class="input-group">
          <span class="input-addon">@</span>
          <input type="text" class="input" id="username" name="username" autocomplete="username" spellcheck="false" placeholder="用户名">
        </div>
      </div>
      <div class="demo-block">
        <label for="amount">带后缀</label>
        <div class="input-group">
          <input type="text" class="input" id="amount" name="amount" inputmode="decimal" placeholder="金额">
          <span class="input-addon">元</span>
        </div>
      </div>
      <div class="demo-block">
        <label for="domain">前后缀</label>
        <div class="input-group">
          <span class="input-addon">https://</span>
          <input type="text" class="input" id="domain" name="domain" spellcheck="false" placeholder="example">
          <span class="input-addon">.com</span>
        </div>
      </div>
      <div class="demo-block">
        <label for="search-input">组合按钮</label>
        <div class="input-group">
          <input type="search" class="input" id="search-input" name="query" autocomplete="off" placeholder="搜索…">
          <button class="button button-primary" type="button">搜索</button>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>多行文本</h2>
      <div class="demo-block">
        <label for="basic-textarea">文本域</label>
        <textarea class="input" id="basic-textarea" name="message" rows="4" placeholder="请输入多行文本…"></textarea>
        <small class="field-help">textarea 直接使用 .input 即可。</small>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
