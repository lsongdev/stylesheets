<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../link.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>链接</h1>
      <p class="demo-subtitle">link.css — 主色链接、悬停下划线、无下划线链接</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>链接类（.link）</h2>
      <p>
        给元素或容器加 <code class="demo-code">.link</code> 即可使用主色链接；悬停时显示下划线。
        <span class="link">这是一个带 .link 的 span。</span>
      </p>
      <div class="demo-column">
        <a class="link" href="#">.link — 主色链接</a>
        <a class="link link-without-underline" href="#">.link.link-without-underline — 主色但无下划线</a>
        <a href="#">普通链接（默认继承文字色）</a>
      </div>
    </div>

    <div class="demo-section">
      <h2>容器级链接</h2>
      <div class="link">
        <p style="margin-top:0">将 <code class="demo-code">.link</code> 放在容器上，容器内所有 <code class="demo-code">&lt;a&gt;</code> 都变为主色：</p>
        <div class="demo-row">
          <a href="#">链接一</a>
          <a href="#">链接二</a>
          <a href="#">链接三</a>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2>结合其他组件</h2>
      <div class="demo-column">
        <div class="card" style="margin:0">
          <p style="margin-top:0">卡片内的 <a class="link link-without-underline" href="#">无下划线链接</a> 与
          <a class="link" href="#">下划线链接</a>。文本按钮也可用 <code class="demo-code">.button.button-link</code>：</p>
          <a class="button button-link" href="#">更多 →</a>
        </div>
      </div>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
