<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航 — CSS Components</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="../theme/light.css">
  <link rel="stylesheet" href="../theme/dark.css">
  <link rel="stylesheet" href="../theme/google.css">
  <link rel="stylesheet" href="../theme/pink.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>导航栏</h1>
      <p class="demo-subtitle">navbar.css — 品牌 + 链接组 + 操作区（仓库中没有 navigation.css）</p>
    </div>
    <div class="demo-toolbar" role="group" aria-label="主题">
      <button class="button button-small" type="button" data-set-theme="light">亮色</button>
      <button class="button button-small" type="button" data-set-theme="dark">暗色</button>
      <button class="button button-small" type="button" data-set-theme="google">谷歌</button>
      <button class="button button-small" type="button" data-set-theme="pink">粉红</button>
    </div>
  </header>

  <main class="demo-main">
    <div class="demo-section">
      <h2>基本导航栏</h2>
      <nav class="navbar" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 16px">
        <a class="navbar-brand" href="#">
          <span class="navbar-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" role="img">
              <path d="M12 2L2 6v6c0 5.5 4.2 10.3 10 11 5.8-.7 10-5.5 10-11V6l-10-4z"/>
            </svg>
          </span>
          CSS Components
        </a>
        <nav>
          <a class="active" href="#">首页</a>
          <a href="#">文档</a>
          <a href="#">组件</a>
        </nav>
        <nav>
          <a href="#">登录</a>
          <button class="button button-small button-primary" type="button">注册</button>
        </nav>
      </nav>
    </div>

    <div class="demo-section">
      <h2>带搜索的导航栏</h2>
      <nav class="navbar" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 16px">
        <a class="navbar-brand" href="#">Brand</a>
        <nav>
          <form action="#" onsubmit="return false">
            <input class="input input-small" type="search" name="q" placeholder="搜索文档…" aria-label="搜索">
          </form>
        </nav>
        <nav>
          <a class="active" href="#">概览</a>
          <a href="#">入门</a>
        </nav>
      </nav>
    </div>

    <div class="demo-section">
      <h2>结合 menu 组件</h2>
      <nav class="navbar" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 16px">
        <a class="navbar-brand" href="#">Brand</a>
        <ul class="menu menu-horizontal">
          <li class="menu-item-active"><a href="#">首页</a></li>
          <li><a href="#">产品</a>
            <ul>
              <li><a href="#">企业版</a></li>
              <li><a href="#">专业版</a></li>
            </ul>
          </li>
          <li><a href="#">定价</a></li>
        </ul>
        <nav>
          <button class="button button-small button-primary" type="button">开始使用</button>
        </nav>
      </nav>
    </div>

    <div class="demo-section">
      <h2>侧边栏（sidebar.css，需单独引入）</h2>
      <p>
        侧边栏由 <code class="demo-code">sidebar.css</code> 提供，未包含在 <code class="demo-code">index.css</code> 中；
        参见 <a href="./index.html" target="_blank" rel="noopener">演示中心</a> 左侧的两栏布局。
      </p>
    </div>
  </main>

  <script src="./demo.js"></script>
</body>
</html>
